# Single-marker gate-follow example used by the validated live test.
# Re-measure marker size, camera calibration, camera mount, and marker-to-gate
# geometry when changing hardware or printed markers.

active_layout: single

dictionary: DICT_4X4_50
# Black square side (m). Current printed markers in this project measure 14.65 cm.
marker_length_m: 0.1465

hole:
  width_m: 0.60
  height_m: 0.60
  marker_margin_m: 0.04

single:
  reference_id: 0
  # This example reports the marker center itself. For a real gate whose center
  # is offset from the marker, replace this with the measured marker-to-gate
  # translation or use marker_to_gate_direction + marker_to_gate_distance_m.
  marker_to_gate_offset_m: [0.0, 0.0, 0.0]
  # The current marker mounting reads about +90 deg before correction.
  yaw_zero_offset_deg: 90.0

four_corners:
  ids:
    top_left: 0
    top_right: 1
    bottom_right: 2
    bottom_left: 3

camera:
  mount_preset: forward_frd
  offset_body_m: [0.0, 0.0, 0.0]
  rpy_body_deg: [0.0, 0.0, 0.0]
